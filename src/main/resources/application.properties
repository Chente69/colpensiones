spring.application.name=afiliaciones
spring.datasource.url=jdbc:h2:mem:usariosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql

# ─── JWT (spring-boot-security-jwt) ─────────────────────
mycorp.app.jwtSecret=${JWT_SECRET:QQM7gfNORywlQRD4TAwViwlp7hmSuyRdNVtS5O+vPgnK4KIVv/p7evCBzPTqEk/Y}
mycorp.app.jwtExpirationMs=86400000

# ─── SSL / TLS ────────────────────────────────────────
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${KEYSTORE_PASS:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=afiliaciones
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2+TLSv1.3
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
